<svg xmlns="http://www.w3.org/2000/svg" id="trust-boundaries-root" aria-labelledby="trust-boundaries-title trust-boundaries-desc" role="img" viewBox="0 0 1280 720"><title id="trust-boundaries-title">Trust boundaries and credentials</title><desc id="trust-boundaries-desc">Architecture diagram of three trust zones: untrusted user devices, the Cloudflare Worker that holds the only service account, and Google storage, with the credential that crosses each boundary.</desc><defs><style>#trust-boundaries-root{--color-paper:#f4efe4;--color-ink:#17140f;--color-muted:#4a4437;--color-accent:#14614a;--font-sans:&apos;Geist&apos;, system-ui, sans-serif;--font-serif:&apos;Instrument Serif&apos;, &apos;Noto Serif&apos;, &apos;Noto Serif KR&apos;, serif;--font-mono:&apos;Geist Mono&apos;, ui-monospace, monospace;font-family:var(--font-sans);color:var(--color-ink)}</style><marker id="trust-boundaries-arrow" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#4a4437" points="0 0 8 3 0 6"/></marker><marker id="trust-boundaries-arrow-accent" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#14614a" points="0 0 8 3 0 6"/></marker><marker id="trust-boundaries-arrow-link" markerHeight="6" markerWidth="8" orient="auto" refX="7" refY="3"><polygon fill="#2a5878" points="0 0 8 3 0 6"/></marker></defs><rect width="100%" height="100%" fill="#f4efe4"/><rect width="288" height="448" x="48" y="136" fill="#17140f" fill-opacity=".03" stroke="#7a705c" stroke-width="1.2" rx="8"/><rect width="200" height="16" x="64" y="142" fill="#f4efe4" rx="2"/><text x="164" y="154" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing=".14em" text-anchor="middle">UNTRUSTED · USER DEVICES</text><rect width="288" height="160" x="496" y="248" fill="#17140f" fill-opacity=".03" stroke="#7a705c" stroke-width="1.2" rx="8"/><rect width="208" height="16" x="512" y="254" fill="#f4efe4" rx="2"/><text x="616" y="266" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing=".14em" text-anchor="middle">CLOUDFLARE · TRUSTED CODE</text><rect width="288" height="448" x="944" y="136" fill="#17140f" fill-opacity=".03" stroke="#7a705c" stroke-width="1.2" rx="8"/><rect width="200" height="16" x="960" y="142" fill="#f4efe4" rx="2"/><text x="1060" y="154" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="500" letter-spacing=".14em" text-anchor="middle">GOOGLE · TRUSTED STORAGE</text><path fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)" d="M 304,208 H 976"/><path fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)" d="M 304,232 H 344 Q 352,232 352,240 V 320 Q 352,328 360,328 H 528"/><path fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)" d="M 304,468 H 368 Q 376,468 376,460 V 360 Q 376,352 384,352 H 528"/><path fill="none" stroke="#4a4437" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)" d="M 752,328 H 824 Q 832,328 832,320 V 240 Q 832,232 840,232 H 976"/><path fill="none" stroke="#14614a" stroke-width="1.4" marker-end="url(#trust-boundaries-arrow-accent)" d="M 752,352 H 864 Q 872,352 872,360 V 460 Q 872,468 880,468 H 976"/><path fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)" d="M 280,184 V 112 Q 280,104 288,104 H 1196 Q 1204,104 1204,112 V 460 Q 1204,468 1196,468 H 1176"/><rect width="112" height="16" x="584" y="184" fill="#f4efe4" rx="2"/><text x="640" y="196" fill="#2a5878" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">GOOGLE LOGIN</text><rect width="80" height="16" x="360" y="272" fill="#f4efe4" rx="2"/><text x="400" y="284" fill="#2a5878" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">ID TOKEN</text><rect width="128" height="16" x="384" y="424" fill="#f4efe4" rx="2"/><text x="448" y="436" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">PERSONAL TOKEN</text><rect width="48" height="16" x="840" y="272" fill="#f4efe4" rx="2"/><text x="864" y="284" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">KEYS</text><rect width="112" height="16" x="752" y="420" fill="#f4efe4" rx="2"/><text x="808" y="432" fill="#14614a" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">SERVICE ACCT</text><rect width="80" height="16" x="700" y="80" fill="#f4efe4" rx="2"/><text x="740" y="92" fill="#2a5878" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" letter-spacing=".06em" text-anchor="middle">ID TOKEN</text><g><rect width="224" height="72" x="80" y="184" fill="#f4efe4" rx="6"/><rect width="224" height="72" x="80" y="184" fill="#fff" stroke="#17140f" stroke-width="1.2" rx="6"/><rect width="36" height="16" x="88" y="192" fill="none" stroke="#17140f" stroke-width=".8" rx="2"/><text x="106" y="203" fill="#17140f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing=".08em" text-anchor="middle">APP</text><text x="192" y="230" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">PWA in the browser</text><text x="192" y="248" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">public code and config</text></g><g><rect width="224" height="72" x="80" y="432" fill="#f4efe4" rx="6"/><rect width="224" height="72" x="80" y="432" fill="#fff" stroke="#17140f" stroke-width="1.2" rx="6"/><rect width="44" height="16" x="88" y="440" fill="none" stroke="#17140f" stroke-width=".8" rx="2"/><text x="110" y="451" fill="#17140f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing=".08em" text-anchor="middle">AGENT</text><text x="192" y="478" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">AI agent + MCP</text><text x="192" y="496" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">holds a personal token</text></g><g><rect width="224" height="72" x="528" y="304" fill="#f4efe4" rx="6"/><rect width="224" height="72" x="528" y="304" fill="#14614a" fill-opacity=".08" stroke="#14614a" stroke-width="1.2" rx="6"/><rect width="36" height="16" x="536" y="312" fill="none" stroke="#14614a" stroke-width=".8" rx="2"/><text x="554" y="323" fill="#14614a" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing=".08em" text-anchor="middle">API</text><text x="640" y="350" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Agent API</text><text x="640" y="368" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">Cloudflare Worker</text></g><g><rect width="200" height="72" x="976" y="184" fill="#f4efe4" rx="6"/><rect width="200" height="72" x="976" y="184" fill="#17140f" fill-opacity=".03" stroke="#7a705c" stroke-width="1.2" rx="6"/><rect width="40" height="16" x="984" y="192" fill="none" stroke="#7a705c" stroke-width=".8" rx="2"/><text x="1004" y="203" fill="#17140f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing=".08em" text-anchor="middle">AUTH</text><text x="1076" y="230" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Firebase Auth</text><text x="1076" y="248" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">signing keys (JWK)</text></g><g><rect width="200" height="72" x="976" y="432" fill="#f4efe4" rx="6"/><rect width="200" height="72" x="976" y="432" fill="#17140f" fill-opacity=".05" stroke="#4a4437" stroke-width="1.2" rx="6"/><rect width="44" height="16" x="984" y="440" fill="none" stroke="#4a4437" stroke-width=".8" rx="2"/><text x="1006" y="451" fill="#17140f" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing=".08em" text-anchor="middle">STORE</text><text x="1076" y="478" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Firestore</text><text x="1076" y="496" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="12" text-anchor="middle">rules by uid</text></g><text x="72" y="548" fill="#4a4437" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" font-size="14" font-style="italic">A leaked token opens one</text><text x="72" y="568" fill="#4a4437" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" font-size="14" font-style="italic">notebook only; revoke it in the app.</text><text x="968" y="548" fill="#4a4437" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" font-size="14" font-style="italic">Rules: each user reaches only</text><text x="968" y="568" fill="#4a4437" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" font-size="14" font-style="italic">users/&lt;own uid&gt;/… in Firestore.</text><line x1="40" x2="1240" y1="660" y2="660" stroke="#7a705c" stroke-width=".8"/><text x="40" y="676" fill="#4a4437" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing=".18em">LEGEND</text><rect width="20" height="14" x="40" y="684" fill="#14614a" fill-opacity=".08" stroke="#14614a" stroke-width="1.2" rx="2"/><text x="68" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Trusted code</text><rect width="20" height="14" x="176" y="684" fill="#fff" stroke="#17140f" stroke-width="1.2" rx="2"/><text x="204" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Untrusted client</text><rect width="20" height="14" x="340" y="684" fill="#17140f" fill-opacity=".05" stroke="#4a4437" stroke-width="1.2" rx="2"/><text x="368" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Store</text><rect width="20" height="14" x="432" y="684" fill="#17140f" fill-opacity=".03" stroke="#7a705c" stroke-width="1.2" rx="2"/><text x="460" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Identity service</text><line x1="600" x2="628" y1="691" y2="691" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/><text x="640" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Firebase ID token</text><line x1="784" x2="812" y1="691" y2="691" stroke="#4a4437" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/><text x="824" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Personal token</text><line x1="948" x2="976" y1="691" y2="691" stroke="#14614a" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-accent)"/><text x="988" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Service account</text><line x1="1114" x2="1142" y1="691" y2="691" stroke="#4a4437" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/><text x="1154" y="695" fill="#17140f" font-family="'Geist', system-ui, sans-serif" font-size="11">Public keys</text></svg>