<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-boundaries-title trust-boundaries-desc" id="trust-boundaries-root">
        <title id="trust-boundaries-title">Trust boundaries and credentials</title>
        <desc id="trust-boundaries-desc">Architecture diagram of three trust zones: untrusted user devices, the Cloudflare Worker that holds the only service account, and Google storage, with the credential that crosses each boundary.</desc>
        <defs>
      <style>#trust-boundaries-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #trust-boundaries-root { font-family: var(--font-sans); color: var(--color-ink); }
      #trust-boundaries-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#trust-boundaries-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="trust-boundaries-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4437"/></marker>
          <marker id="trust-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#14614a"/></marker>
          <marker id="trust-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a5878"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4efe4"/>

        <!-- trust zones -->
        <rect x="48" y="136" width="288" height="448" rx="8" fill="#17140f" stroke="#7a705c" stroke-width="1.2" fill-opacity="0.03"/>
        <rect x="64" y="142" width="200" height="16" rx="2" fill="#f4efe4"/>
        <text x="164" y="154" fill="#4a4437" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">UNTRUSTED · USER DEVICES</text>
        <rect x="496" y="248" width="288" height="160" rx="8" fill="#17140f" stroke="#7a705c" stroke-width="1.2" fill-opacity="0.03"/>
        <rect x="512" y="254" width="208" height="16" rx="2" fill="#f4efe4"/>
        <text x="616" y="266" fill="#4a4437" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE · TRUSTED CODE</text>
        <rect x="944" y="136" width="288" height="448" rx="8" fill="#17140f" stroke="#7a705c" stroke-width="1.2" fill-opacity="0.03"/>
        <rect x="960" y="142" width="200" height="16" rx="2" fill="#f4efe4"/>
        <text x="1060" y="154" fill="#4a4437" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">GOOGLE · TRUSTED STORAGE</text>
        <!-- arrows (behind boxes) -->
        <path d="M 304,208 H 976" fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/>
        <path d="M 304,232 H 344 Q 352,232 352,240 V 320 Q 352,328 360,328 H 528" fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/>
        <path d="M 304,468 H 368 Q 376,468 376,460 V 360 Q 376,352 384,352 H 528" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/>
        <path d="M 752,328 H 824 Q 832,328 832,320 V 240 Q 832,232 840,232 H 976" fill="none" stroke="#4a4437" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#trust-boundaries-arrow)"/>
        <path d="M 752,352 H 864 Q 872,352 872,360 V 460 Q 872,468 880,468 H 976" fill="none" stroke="#14614a" stroke-width="1.4" marker-end="url(#trust-boundaries-arrow-accent)"/>
        <path d="M 280,184 V 112 Q 280,104 288,104 H 1196 Q 1204,104 1204,112 V 460 Q 1204,468 1196,468 H 1176" fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/>
        <!-- arrow labels -->
        <rect x="584" y="184" width="112" height="16" rx="2" fill="#f4efe4"/>
        <text x="640" y="196" fill="#2a5878" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GOOGLE LOGIN</text>
        <rect x="360" y="272" width="80" height="16" rx="2" fill="#f4efe4"/>
        <text x="400" y="284" fill="#2a5878" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ID TOKEN</text>
        <rect x="384" y="424" width="128" height="16" rx="2" fill="#f4efe4"/>
        <text x="448" y="436" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PERSONAL TOKEN</text>
        <rect x="840" y="272" width="48" height="16" rx="2" fill="#f4efe4"/>
        <text x="864" y="284" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KEYS</text>
        <rect x="752" y="420" width="112" height="16" rx="2" fill="#f4efe4"/>
        <text x="808" y="432" fill="#14614a" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SERVICE ACCT</text>
        <rect x="700" y="80" width="80" height="16" rx="2" fill="#f4efe4"/>
        <text x="740" y="92" fill="#2a5878" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ID TOKEN</text>
        <!-- nodes -->
        <g>
        <rect x="80" y="184" width="224" height="72" rx="6" fill="#f4efe4"/>
        <rect x="80" y="184" width="224" height="72" rx="6" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <rect x="88" y="192" width="36" height="16" rx="2" fill="none" stroke="#17140f" stroke-width="0.8"/>
        <text x="106" y="203" fill="#17140f" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="192" y="230" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PWA in the browser</text>
        <text x="192" y="248" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">public code and config</text>
        </g>
        <g>
        <rect x="80" y="432" width="224" height="72" rx="6" fill="#f4efe4"/>
        <rect x="80" y="432" width="224" height="72" rx="6" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <rect x="88" y="440" width="44" height="16" rx="2" fill="none" stroke="#17140f" stroke-width="0.8"/>
        <text x="110" y="451" fill="#17140f" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="192" y="478" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AI agent + MCP</text>
        <text x="192" y="496" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">holds a personal token</text>
        </g>
        <g>
        <rect x="528" y="304" width="224" height="72" rx="6" fill="#f4efe4"/>
        <rect x="528" y="304" width="224" height="72" rx="6" fill="#14614a" stroke="#14614a" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="536" y="312" width="36" height="16" rx="2" fill="none" stroke="#14614a" stroke-width="0.8"/>
        <text x="554" y="323" fill="#14614a" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="640" y="350" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent API</text>
        <text x="640" y="368" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Cloudflare Worker</text>
        </g>
        <g>
        <rect x="976" y="184" width="200" height="72" rx="6" fill="#f4efe4"/>
        <rect x="976" y="184" width="200" height="72" rx="6" fill="#17140f" stroke="#7a705c" stroke-width="1.2" fill-opacity="0.03"/>
        <rect x="984" y="192" width="40" height="16" rx="2" fill="none" stroke="#7a705c" stroke-width="0.8"/>
        <text x="1004" y="203" fill="#17140f" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="1076" y="230" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Firebase Auth</text>
        <text x="1076" y="248" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">signing keys (JWK)</text>
        </g>
        <g>
        <rect x="976" y="432" width="200" height="72" rx="6" fill="#f4efe4"/>
        <rect x="976" y="432" width="200" height="72" rx="6" fill="#17140f" stroke="#4a4437" stroke-width="1.2" fill-opacity="0.05"/>
        <rect x="984" y="440" width="44" height="16" rx="2" fill="none" stroke="#4a4437" stroke-width="0.8"/>
        <text x="1006" y="451" fill="#17140f" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="1076" y="478" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Firestore</text>
        <text x="1076" y="496" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rules by uid</text>
        </g>
        <!-- notes -->
        <text x="72" y="548" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">A leaked token opens one</text>
        <text x="72" y="568" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">notebook only; revoke it in the app.</text>
        <text x="968" y="548" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">Rules: each user reaches only</text>
        <text x="968" y="568" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">users/&lt;own uid&gt;/… in Firestore.</text>
        <!-- legend -->
        <line x1="40" y1="660" x2="1240" y2="660" stroke="#7a705c" stroke-width="0.8"/>
        <text x="40" y="676" fill="#4a4437" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="684" width="20" height="14" rx="2" fill="#14614a" stroke="#14614a" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="68" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Trusted code</text>
        <rect x="176" y="684" width="20" height="14" rx="2" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <text x="204" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Untrusted client</text>
        <rect x="340" y="684" width="20" height="14" rx="2" fill="#17140f" stroke="#4a4437" stroke-width="1.2" fill-opacity="0.05"/>
        <text x="368" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Store</text>
        <rect x="432" y="684" width="20" height="14" rx="2" fill="#17140f" stroke="#7a705c" stroke-width="1.2" fill-opacity="0.03"/>
        <text x="460" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Identity service</text>
        <line x1="600" y1="691" x2="628" y2="691" stroke="#2a5878" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-link)"/>
        <text x="640" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Firebase ID token</text>
        <line x1="784" y1="691" x2="812" y2="691" stroke="#4a4437" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow)"/>
        <text x="824" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Personal token</text>
        <line x1="948" y1="691" x2="976" y2="691" stroke="#14614a" stroke-width="1.2" marker-end="url(#trust-boundaries-arrow-accent)"/>
        <text x="988" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Service account</text>
        <line x1="1114" y1="691" x2="1142" y2="691" stroke="#4a4437" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#trust-boundaries-arrow)"/>
        <text x="1154" y="695" fill="#17140f" font-size="11" font-family="'Geist', system-ui, sans-serif">Public keys</text>
      </svg>
