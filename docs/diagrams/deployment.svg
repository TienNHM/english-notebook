<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-title deployment-desc" id="deployment-root">
        <title id="deployment-title">Where it runs and how it ships</title>
        <desc id="deployment-desc">Deployment diagram: the developer PC pushes to GitHub (Pages publishes the app), deploys the Worker to Cloudflare and the Firestore rules to Firebase, and learners install the plugin from the GitHub repos.</desc>
        <defs>
      <style>#deployment-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #deployment-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deployment-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#deployment-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="deployment-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4437"/></marker>
          <marker id="deployment-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#14614a"/></marker>
          <marker id="deployment-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a5878"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4efe4"/>

