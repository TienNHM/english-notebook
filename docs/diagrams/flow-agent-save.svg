<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-agent-save-title flow-agent-save-desc" id="flow-agent-save-root">
        <title id="flow-agent-save-title">The agent saves a sentence</title>
        <desc id="flow-agent-save-desc">Sequence diagram of an AI agent calling the MCP server, which calls the Worker; the Worker checks the token, looks for duplicates, commits the cards to Firestore and answers with the count.</desc>
        <defs>
      <style>#flow-agent-save-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #flow-agent-save-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-agent-save-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#flow-agent-save-root .diagram-container { overflow-x: visible; }
}</style>
