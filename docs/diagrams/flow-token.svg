<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-token-title flow-token-desc" id="flow-token-root">
        <title id="flow-token-title">Create a personal agent token</title>
        <desc id="flow-token-desc">Sequence diagram of the app asking the Worker for a token: the Worker checks the Firebase login, makes a random token, stores only its hash in KV and returns the token once.</desc>
        <defs>
      <style>#flow-token-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #flow-token-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-token-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#flow-token-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="flow-token-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4a4437"/></marker>
          <marker id="flow-token-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#14614a"/></marker>
          <marker id="flow-token-arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2a5878"/></marker>
          <marker id="flow-token-arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0 0, 10 4, 0 8" fill="none" stroke="#4a4437" stroke-width="1.4"/></marker>
        </defs>
