<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-token-title flow-token-desc" id="flow-token-root">
        <title id="flow-token-title">Create a personal agent token</title>
        <desc id="flow-token-desc">Sequence diagram of the app asking the Worker for a token: the Worker checks the Firebase login, makes a random token, stores only its hash in KV and shows the token once.</desc>
        <defs>
      <style>#flow-token-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #5f584b;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #flow-token-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-token-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#flow-token-root .diagram-container { overflow-x: visible; }
}</style>
