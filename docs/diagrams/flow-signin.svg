<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-signin-title flow-signin-desc" id="flow-signin-root">
        <title id="flow-signin-title">Sign in and sync</title>
        <desc id="flow-signin-desc">Sequence diagram of the learner signing in with Google, the app listening to Firestore, and receiving a live snapshot after a write.</desc>
        <defs>
      <style>#flow-signin-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #flow-signin-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-signin-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#flow-signin-root .diagram-container { overflow-x: visible; }
}</style>
