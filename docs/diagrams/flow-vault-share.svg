<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 944" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-vault-share-title flow-vault-share-desc" id="flow-vault-share-root">
        <title id="flow-vault-share-title">Share a vocabulary vault</title>
        <desc id="flow-vault-share-desc">Sequence diagram of an owner sharing cards: the app keeps only text, meaning and tags, writes a share with a random id, the owner sends the link, and the receiver imports a copy into their own notebook.</desc>
        <defs>
      <style>#flow-vault-share-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #flow-vault-share-root { font-family: var(--font-sans); color: var(--color-ink); }
      #flow-vault-share-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#flow-vault-share-root .diagram-container { overflow-x: visible; }
}</style>
