<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share a vocabulary vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SEQUENCE · English Notebook</p>
    <h1>Share a vocabulary vault</h1>

    <div class="diagram-container">

        <desc id="flow-vault-share-desc">Sequence diagram of an owner sharing cards: the app keeps only text, meaning and tags, writes a share with a random id, the owner sends the link, and the receiver imports a copy into their own notebook.</desc>

          <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0 0, 10 4, 0 8" fill="none" stroke="#4a4437" stroke-width="1.4"/></marker>

        <rect width="100%" height="100%" fill="#f4efe4"/>

        <line x1="1152" y1="536" x2="900" y2="536" stroke="#4a4437" stroke-width="1.4" marker-end="url(#arrow)"/>

        <line x1="1152" y1="728" x2="900" y2="728" stroke="#4a4437" stroke-width="1.4" marker-end="url(#arrow)"/>

        <rect x="552" y="32" width="176" height="64" rx="6" fill="#f4efe4"/>
        <rect x="552" y="32" width="176" height="64" rx="6" fill="rgba(23,20,15,0.07)" stroke="#4a4437" stroke-width="1.2"/>
        <text x="640" y="60" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Firestore</text>
        <text x="640" y="80" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">shares · users</text>
        <rect x="808" y="32" width="176" height="64" rx="6" fill="#f4efe4"/>
        <rect x="808" y="32" width="176" height="64" rx="6" fill="#fffbf2" stroke="#17140f" stroke-width="1.2"/>
        <text x="896" y="60" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receiver's app</text>
        <text x="896" y="80" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">PWA</text>

  </div>
</body>
</html>
