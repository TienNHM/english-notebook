        <text x="816" y="158" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Firebase Auth</text>
        <text x="816" y="176" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Google sign-in</text>
        </g>
