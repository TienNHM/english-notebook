        <text x="1144" y="632" fill="#4a4437" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">english-notebook-mcp</text>
        </g>
        <!-- note -->
        <text x="48" y="128" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">Not drawn: the GitHub repos.</text>
        <text x="48" y="148" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">Actions publishes the PWA;</text>
        <text x="48" y="168" fill="#4a4437" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif">the marketplace ships the plugin.</text>
