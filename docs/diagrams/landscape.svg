<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="landscape-title landscape-desc" id="landscape-root">
        <title id="landscape-title">System landscape</title>
        <desc id="landscape-desc">Architecture diagram of English Notebook: the learner uses the PWA and an AI agent; the PWA talks to Firebase directly, while the agent reaches the notebook through an MCP server and a Cloudflare Worker.</desc>
        <defs>
      <style>#landscape-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #landscape-root { font-family: var(--font-sans); color: var(--color-ink); }
      #landscape-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#landscape-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="landscape-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4437"/></marker>
          <marker id="landscape-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#14614a"/></marker>
          <marker id="landscape-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a5878"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4efe4"/>

        <!-- arrows (behind boxes) -->
        <path d="M 208,300 H 288" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#landscape-arrow)"/>
        <path d="M 128,336 V 596 Q 128,604 136,604 H 704" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#landscape-arrow)"/>
        <path d="M 512,288 H 536 Q 544,288 544,280 V 156 Q 544,148 552,148 H 704" fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#landscape-arrow-link)"/>
        <path d="M 512,312 H 536 Q 544,312 544,320 V 444 Q 544,452 552,452 H 704" fill="none" stroke="#2a5878" stroke-width="1.2" marker-end="url(#landscape-arrow-link)"/>
