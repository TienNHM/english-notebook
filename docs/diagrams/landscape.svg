        <rect x="1008" y="444" width="128" height="16" rx="2" fill="#f4efe4"/>
        <text x="1072" y="456" fill="#14614a" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PERSONAL TOKEN</text>
