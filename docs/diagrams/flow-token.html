<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a personal agent token</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SEQUENCE · English Notebook</p>
    <h1>Create a personal agent token</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-token-title flow-token-desc">
        <title id="flow-token-title">Create a personal agent token</title>
        <desc id="flow-token-desc">Sequence diagram of the app asking the Worker for a token: the Worker checks the Firebase login, makes a random token, stores only its hash in KV and returns the token once.</desc>
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4a4437"/></marker>
          <marker id="arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#14614a"/></marker>
          <marker id="arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2a5878"/></marker>
          <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polyline points="0 0, 10 4, 0 8" fill="none" stroke="#4a4437" stroke-width="1.4"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f4efe4"/>
        <line x1="144" y1="96" x2="144" y2="560" stroke="#7a705c" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line x1="400" y1="96" x2="400" y2="560" stroke="#7a705c" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line x1="656" y1="96" x2="656" y2="560" stroke="#7a705c" stroke-width="1.2" stroke-dasharray="4,4"/>
        <line x1="912" y1="96" x2="912" y2="560" stroke="#7a705c" stroke-width="1.2" stroke-dasharray="4,4"/>
        <rect x="396" y="140" width="8" height="376" fill="#e3dccb" stroke="#4a4437" stroke-width="1"/>
        <rect x="652" y="204" width="8" height="248" fill="#e3dccb" stroke="#4a4437" stroke-width="1"/>
        <rect x="908" y="364" width="8" height="24" fill="#e3dccb" stroke="#4a4437" stroke-width="1"/>
        <line x1="144" y1="152" x2="396" y2="152" stroke="#4a4437" stroke-width="1.4" marker-end="url(#arrow)"/>
        <line x1="404" y1="216" x2="652" y2="216" stroke="#2a5878" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <path d="M 660 280 L 692 280 Q 700 280 700 288 L 700 304 Q 700 312 692 312 L 662 312" fill="none" stroke="#4a4437" stroke-width="1.4" marker-end="url(#arrow)"/>
        <line x1="660" y1="376" x2="908" y2="376" stroke="#4a4437" stroke-width="1.4" marker-end="url(#arrow)"/>
        <line x1="652" y1="440" x2="404" y2="440" stroke="#14614a" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <line x1="396" y1="504" x2="144" y2="504" stroke="#4a4437" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
        <rect x="216" y="126" width="108" height="18" rx="2" fill="#f4efe4"/>
        <text x="270" y="139" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CREATE TOKEN</text>
        <rect x="474" y="190" width="108" height="18" rx="2" fill="#f4efe4"/>
        <text x="528" y="203" fill="#2a5878" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /TOKENS</text>
        <rect x="710" y="287" width="116" height="18" rx="2" fill="#f4efe4"/>
        <text x="718" y="300" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.04em">VERIFY + MAKE</text>
        <rect x="730" y="350" width="108" height="18" rx="2" fill="#f4efe4"/>
        <text x="784" y="363" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PUT HASH+UID</text>
        <rect x="474" y="414" width="108" height="18" rx="2" fill="#f4efe4"/>
        <text x="528" y="427" fill="#14614a" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">TOKEN (ONCE)</text>
        <rect x="220" y="478" width="100" height="18" rx="2" fill="#f4efe4"/>
        <text x="270" y="491" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SHOW + COPY</text>
        <text x="952" y="412" fill="#17140f" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">only the hash is stored,</text>
        <text x="952" y="434" fill="#17140f" font-size="16" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">never the token</text>
        <path d="M 948 406 Q 936 384 920 376" fill="none" stroke="rgba(23,20,15,0.55)" stroke-width="1.2" stroke-dasharray="4,3"/>
        <circle cx="920" cy="376" r="2.5" fill="#17140f"/>
        <rect x="56" y="32" width="176" height="64" rx="6" fill="#f4efe4"/>
        <rect x="56" y="32" width="176" height="64" rx="6" fill="rgba(74,68,55,0.12)" stroke="#544d3f" stroke-width="1.2"/>
        <text x="144" y="60" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Learner</text>
        <text x="144" y="80" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">person</text>
        <rect x="312" y="32" width="176" height="64" rx="6" fill="#f4efe4"/>
        <rect x="312" y="32" width="176" height="64" rx="6" fill="#fffbf2" stroke="#17140f" stroke-width="1.2"/>
        <text x="400" y="60" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PWA</text>
        <text x="400" y="80" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Library screen</text>
        <rect x="568" y="32" width="176" height="64" rx="6" fill="#f4efe4"/>
        <rect x="568" y="32" width="176" height="64" rx="6" fill="rgba(20,97,74,0.08)" stroke="#14614a" stroke-width="1.2"/>
        <text x="656" y="60" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
        <text x="656" y="80" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">agent API</text>
        <rect x="824" y="32" width="176" height="64" rx="6" fill="#f4efe4"/>
        <rect x="824" y="32" width="176" height="64" rx="6" fill="rgba(23,20,15,0.07)" stroke="#4a4437" stroke-width="1.2"/>
        <text x="912" y="60" fill="#17140f" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">KV</text>
        <text x="912" y="80" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">TOKENS</text>
        <line x1="56" y1="584" x2="1224" y2="584" stroke="rgba(23,20,15,0.22)" stroke-width="1"/>
        <text x="56" y="606" fill="#4a4437" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="56" y1="631" x2="88" y2="631" stroke="#4a4437" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="96" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Call</text>
        <line x1="148" y1="631" x2="180" y2="631" stroke="#4a4437" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
        <text x="188" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Return</text>
        <rect x="264" y="622" width="8" height="18" fill="#e3dccb" stroke="#4a4437" stroke-width="1"/>
        <text x="292" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Active</text>
        <line x1="356" y1="631" x2="388" y2="631" stroke="#2a5878" stroke-width="1.4" marker-end="url(#arrow-link)"/>
        <text x="396" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">HTTPS call</text>
        <line x1="484" y1="631" x2="516" y2="631" stroke="#14614a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="524" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Token shown once</text>
        <rect x="648" y="622" width="24" height="16" rx="3" fill="rgba(74,68,55,0.12)" stroke="#544d3f" stroke-width="1.2"/>
        <text x="680" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Person</text>
        <rect x="744" y="622" width="24" height="16" rx="3" fill="#fffbf2" stroke="#17140f" stroke-width="1.2"/>
        <text x="776" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">App</text>
        <rect x="824" y="622" width="24" height="16" rx="3" fill="rgba(20,97,74,0.08)" stroke="#14614a" stroke-width="1.2"/>
        <text x="856" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Focal</text>
        <rect x="916" y="622" width="24" height="16" rx="3" fill="rgba(23,20,15,0.07)" stroke="#4a4437" stroke-width="1.2"/>
        <text x="948" y="635" fill="#4a4437" font-size="11" font-family="'Geist', sans-serif">Storage</text>
      </svg>
    </div>
  </div>
</body>
</html>
