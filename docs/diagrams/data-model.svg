<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-model-title data-model-desc" id="data-model-root">
        <title id="data-model-title">Firestore data model</title>
        <desc id="data-model-desc">Entity-relationship diagram of the English Notebook Firestore data: a user owns items and one progress document and creates shares that contain shared items; Worker KV keys live outside Firestore.</desc>
        <defs>
      <style>#data-model-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #data-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #data-model-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#data-model-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="data-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4437"/></marker>
          <marker id="data-model-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#14614a"/></marker>
          <marker id="data-model-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a5878"/></marker>
        </defs>

