        <line x1="640" y1="128" x2="640" y2="224" fill="none" stroke="#4a4437" stroke-width="1.2"/>
        <line x1="1080" y1="272" x2="1080" y2="368" fill="none" stroke="#4a4437" stroke-width="1.2"/>
        <path d="M 100,296 V 320 Q 100,328 108,328 H 252 Q 260,328 260,320 V 296" fill="none" stroke="#4a4437" stroke-width="1.2"/>
