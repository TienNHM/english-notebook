        <rect x="592" y="168" width="40" height="16" rx="2" fill="#f4efe4"/><text x="612" y="180" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HAS</text>
