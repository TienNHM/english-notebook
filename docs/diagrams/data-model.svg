        <rect x="396" y="94" width="48" height="16" rx="2" fill="#f4efe4"/><text x="420" y="106" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OWNS</text>
        <rect x="810" y="66" width="16" height="16" rx="2" fill="#f4efe4"/><text x="818" y="78" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text><rect x="894" y="66" width="16" height="16" rx="2" fill="#f4efe4"/><text x="902" y="78" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>
