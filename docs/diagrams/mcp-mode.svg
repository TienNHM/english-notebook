<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 764" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-mode-title mcp-mode-desc" id="mcp-mode-root">
        <title id="mcp-mode-title">How the MCP server picks its mode</title>
        <desc id="mcp-mode-desc">Flowchart of the MCP server start-up: a personal token selects token mode through the Worker API unless key variables are also set; otherwise both key variables select key mode, one alone is an error, and none selects inbox mode.</desc>
        <defs>
      <style>#mcp-mode-root { --color-paper:   #f4efe4;
      --color-ink:     #17140f;
      --color-muted:   #4a4437;
      --color-accent:  #14614a;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #mcp-mode-root { font-family: var(--font-sans); color: var(--color-ink); }
      #mcp-mode-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#mcp-mode-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="mcp-mode-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a4437"/></marker>
          <marker id="mcp-mode-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#14614a"/></marker>
          <marker id="mcp-mode-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a5878"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f4efe4"/>

        <!-- Arrows (drawn first) -->
        <line x1="480" y1="104" x2="480" y2="168" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <line x1="620" y1="232" x2="676" y2="232" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <line x1="480" y1="296" x2="480" y2="360" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <line x1="956" y1="232" x2="1016" y2="232" fill="none" stroke="#14614a" stroke-width="1.2" marker-end="url(#mcp-mode-arrow-accent)"/>
        <line x1="816" y1="296" x2="816" y2="392" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <line x1="620" y1="424" x2="716" y2="424" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <line x1="340" y1="424" x2="240" y2="424" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <line x1="480" y1="488" x2="480" y2="560" fill="none" stroke="#4a4437" stroke-width="1.2" marker-end="url(#mcp-mode-arrow)"/>
        <!-- Branch labels (6px clear of each arrow) -->
        <rect x="628" y="210" width="40" height="16" rx="2" fill="#f4efe4"/><text x="648" y="222" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="486" y="320" width="32" height="16" rx="2" fill="#f4efe4"/><text x="502" y="332" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="970" y="210" width="32" height="16" rx="2" fill="#f4efe4"/><text x="986" y="222" fill="#14614a" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="824" y="336" width="40" height="16" rx="2" fill="#f4efe4"/><text x="844" y="348" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="628" y="402" width="80" height="16" rx="2" fill="#f4efe4"/><text x="668" y="414" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONLY ONE</text>
        <rect x="266" y="402" width="48" height="16" rx="2" fill="#f4efe4"/><text x="290" y="414" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOTH</text>
        <rect x="488" y="516" width="72" height="16" rx="2" fill="#f4efe4"/><text x="524" y="528" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEITHER</text>
        <!-- Terminal: MCP server starts -->
        <rect x="370" y="40" width="220" height="64" rx="32" fill="#f4efe4"/>
        <rect x="370" y="40" width="220" height="64" rx="32" fill="#17140f" stroke="#4a4437" stroke-width="1.2" fill-opacity="0.07"/>
        <text x="480" y="78" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">MCP server starts</text>
        <!-- Decision: Token set? -->
        <polygon points="480,168 620,232 480,296 340,232" fill="#f4efe4"/>
        <polygon points="480,168 620,232 480,296 340,232" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <text x="480" y="230" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Token set?</text>
        <text x="480" y="250" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">ENGLISH_NOTEBOOK_TOKEN</text>
        <!-- Decision: Key variables too? -->
        <polygon points="816,168 956,232 816,296 676,232" fill="#f4efe4"/>
        <polygon points="816,168 956,232 816,296 676,232" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <text x="816" y="230" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Key variables too?</text>
        <text x="816" y="250" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">SERVICE_ACCOUNT · UID</text>
        <!-- Decision: Key variables set? -->
        <polygon points="480,360 620,424 480,488 340,424" fill="#f4efe4"/>
        <polygon points="480,360 620,424 480,488 340,424" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <text x="480" y="422" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Key variables set?</text>
        <text x="480" y="442" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">SERVICE_ACCOUNT + UID</text>
        <!-- Terminal: Exit with error -->
        <rect x="716" y="392" width="200" height="64" rx="32" fill="#f4efe4"/>
        <rect x="716" y="392" width="200" height="64" rx="32" fill="#17140f" stroke="#4a4437" stroke-width="1.2" fill-opacity="0.06"/>
        <text x="816" y="430" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Exit with error</text>
        <!-- Outcome: Token mode -->
        <rect x="1016" y="188" width="224" height="88" rx="6" fill="#f4efe4"/>
        <rect x="1016" y="188" width="224" height="88" rx="6" fill="#14614a" stroke="#14614a" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="1024" y="196" width="44" height="16" rx="2" fill="none" stroke="#14614a" stroke-width="0.8" stroke-opacity="0.55"/>
        <text x="1046" y="208" fill="#14614a" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
        <text x="1128" y="240" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Token mode</text>
        <text x="1128" y="262" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">→ Worker API (HTTPS)</text>
        <!-- Outcome: Key mode -->
        <rect x="40" y="380" width="200" height="88" rx="6" fill="#f4efe4"/>
        <rect x="40" y="380" width="200" height="88" rx="6" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <rect x="48" y="388" width="44" height="16" rx="2" fill="none" stroke="#17140f" stroke-width="0.8" stroke-opacity="0.45"/>
        <text x="70" y="400" fill="#17140f" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
        <text x="140" y="432" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Key mode</text>
        <text x="140" y="454" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">Firestore Admin SDK</text>
        <!-- Outcome: Inbox mode -->
        <rect x="360" y="560" width="240" height="88" rx="6" fill="#f4efe4"/>
        <rect x="360" y="560" width="240" height="88" rx="6" fill="#17140f" stroke="#4a4437" stroke-width="1.2" fill-opacity="0.06"/>
        <rect x="368" y="568" width="44" height="16" rx="2" fill="none" stroke="#17140f" stroke-width="0.8" stroke-opacity="0.35"/>
        <text x="390" y="580" fill="#4a4437" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODE</text>
        <text x="480" y="612" fill="#17140f" font-size="16" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Inbox mode</text>
        <text x="480" y="634" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">inbox.json · localhost</text>
        <line x1="40" y1="696" x2="1240" y2="696" stroke="#17140f" stroke-width="1" stroke-opacity="0.22"/>
        <text x="40" y="718" fill="#4a4437" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>
        <rect x="40" y="729" width="24" height="12" rx="6" fill="#17140f" stroke="#4a4437" stroke-width="1.2" fill-opacity="0.07"/>
        <text x="72" y="740" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace">Start / end</text>
        <polygon points="193,728 205,735 193,742 181,735" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <text x="213" y="740" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace">Decision</text>
        <rect x="300" y="729" width="16" height="12" rx="2" fill="#ffffff" stroke="#17140f" stroke-width="1.2"/>
        <text x="324" y="740" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace">Running mode</text>
        <rect x="441" y="729" width="16" height="12" rx="2" fill="#14614a" stroke="#14614a" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="465" y="740" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace">Recommended</text>
        <line x1="574" y1="735" x2="598" y2="735" stroke="#14614a" stroke-width="1.2" marker-end="url(#mcp-mode-arrow-accent)"/>
        <text x="606" y="740" fill="#4a4437" font-size="12" font-family="'Geist Mono', monospace">Path to token mode</text>
      </svg>
