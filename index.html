<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd93d">
<title>English Notebook</title>
<meta name="description" content="Learn English from what you read and write at work. Save words, phrases and sentences, review them with spaced repetition, and keep a daily streak.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="English Notebook">
<meta property="og:title" content="English Notebook">
<meta property="og:description" content="Learn English from what you read and write at work. Daily streak, spaced review and context cards.">
<meta property="og:url" content="https://english-notebook.tiennhm.io.vn/">
<meta property="og:image" content="https://english-notebook.tiennhm.io.vn/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="English Notebook">
<meta name="twitter:description" content="Learn English from what you read and write at work.">
<meta name="twitter:image" content="https://english-notebook.tiennhm.io.vn/og-image.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<script>try{var d=document.documentElement,t=localStorage.getItem("english-notebook-theme"),m=localStorage.getItem("english-notebook-motion");if(t==="light"||t==="dark")d.dataset.theme=t;if(m==="on"||m==="off")d.dataset.motion=m}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="logo">📒 English Notebook</h1>
  <div class="pills"><span id="rewardPills"></span><span id="stats" class="pill"></span><span id="auth"></span><button id="themeBtn" class="small" type="button"></button></div>
</header>

<nav>
  <button data-tab="add" class="active">➕ Thêm</button>
  <button data-tab="library">📚 Thư viện</button>
  <button data-tab="review">🧠 Ôn tập<span id="dueBadge" class="badge"></span></button>
  <button data-tab="rewards">🏆 Thưởng</button>
</nav>

<main>
  <section id="tab-add" class="tab active">
    <form id="addForm">
      <input type="hidden" id="editId">
      <select id="fType" aria-hidden="true" tabindex="-1">
        <option value="word">Từ (word)</option>
        <option value="phrase">Cụm từ (phrase)</option>
        <option value="sentence">Câu (sentence)</option>
      </select>
      <div class="seg" id="seg" role="group" aria-label="Loại">
        <button type="button" data-v="word">🔤 Từ</button>
        <button type="button" data-v="phrase">🧩 Cụm từ</button>
        <button type="button" data-v="sentence">💬 Câu</button>
      </div>
      <label>Tiếng Anh *
        <input id="fText" required autocomplete="off" placeholder="e.g. find out / I'll look into it">
      </label>
      <label>Nghĩa tiếng Việt *
        <input id="fMeaning" required autocomplete="off" placeholder="tìm ra / mình sẽ xem xét">
      </label>
      <div id="sentenceOnly" hidden>
        <label>Câu gốc (tiếng Việt / ngữ cảnh)
          <input id="fOriginal" autocomplete="off" placeholder="Check lại câu hỏi đi, tôi thấy đâu có gì khó hiểu đâu.">
        </label>
        <label>Cụm từ rút ra từ câu (mỗi dòng: english = nghĩa)
          <textarea id="fExpr" rows="3" placeholder="check again = kiểm tra lại&#10;hard to understand = khó hiểu"></textarea>
        </label>
      </div>
      <label>Ví dụ (example)
        <textarea id="fExample" rows="2" placeholder="Can you help me find out why the API fails?"></textarea>
      </label>
      <label>Ghi chú (note)
        <input id="fNote" autocomplete="off" placeholder="phát âm, lỗi hay gặp, ngữ cảnh...">
      </label>
      <label>Tags (cách nhau bằng dấu phẩy)
        <input id="fTags" autocomplete="off" placeholder="work, git, meeting">
      </label>
      <div class="row">
        <button type="submit" class="primary" id="saveBtn">Lưu</button>
        <button type="button" id="cancelEdit" hidden>Huỷ sửa</button>
      </div>
    </form>
  </section>

  <section id="tab-library" class="tab">
    <div class="tools-bar">
      <input id="q" class="grow" type="search" placeholder="🔎 Tìm kiếm...">
      <select id="fltType">
        <option value="">Tất cả</option>
        <option value="word">Từ</option>
        <option value="phrase">Cụm từ</option>
        <option value="sentence">Câu</option>
      </select>
    </div>
    <div id="tagBar" class="tags"></div>
    <ul id="list" class="list"></ul>
    <div class="row tools">
      <button id="exportBtn">⬇ Xuất JSON</button>
      <label class="btn">⬆ Nhập JSON<input id="importFile" type="file" accept="application/json" hidden></label>
    </div>
  </section>

  <section id="tab-review" class="tab">
    <div id="reviewBox"></div>
  </section>

  <section id="tab-rewards" class="tab">
    <div id="rewardsBox"></div>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>
<div id="celebrate" class="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="celTitle">
    <h2 id="celTitle"></h2>
    <div id="celBody"></div>
    <div class="btnrow">
      <button id="celShare" type="button">📣 Chia sẻ</button>
      <button class="primary" id="celClose" type="button">Tiếp tục</button>
    </div>
  </div>
</div>

<div id="shareDlg" class="overlay" hidden>
  <div class="modal share" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <h2 id="shareTitle">📣 Chia sẻ thành tích</h2>
    <canvas id="shareCanvas" width="1080" height="1080" aria-label="Ảnh thẻ thành tích"></canvas>
    <label>Nội dung (sửa được)
      <textarea id="shareText" rows="4"></textarea>
    </label>
    <div class="sharegrid" id="shareGrid">
      <button type="button" data-share="native" hidden>📲 Chia sẻ…</button>
      <button type="button" data-share="facebook">Facebook</button>
      <button type="button" data-share="x">X</button>
      <button type="button" data-share="linkedin">LinkedIn</button>
      <button type="button" data-share="telegram">Telegram</button>
      <button type="button" data-share="copy">📋 Chép chữ</button>
      <button type="button" data-share="copyimg" hidden>🖼 Chép ảnh</button>
      <button type="button" data-share="download">⬇ Tải ảnh</button>
    </div>
    <p class="muted-sm">Ảnh được vẽ ngay trên máy bạn, không có tên hay email và không được tải lên đâu cả. Nút mạng xã hội chỉ mở trang chia sẻ với chữ và link; hãy đính kèm ảnh đã tải. Menu 📲 trên điện thoại thì đính kèm được ảnh.</p>
    <button class="primary" id="shareClose" type="button">Đóng</button>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
