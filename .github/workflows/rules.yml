name: Firestore rules test

# Runs the security-rules test against the local Firestore emulator (demo project, never touches production).
on:
  push:
    paths:
      - firestore.rules
      - firebase.json
      - tests/emulator/**
      - .github/workflows/rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - tests/emulator/**
      - .github/workflows/rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/emulator/package-lock.json
      # the emulator jar is downloaded on the first run; keep it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/emulator/package-lock.json') }}
      - run: npm ci
      - name: Rules test (emulator)
        run: npm test
