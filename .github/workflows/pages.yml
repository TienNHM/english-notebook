name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A broken commit must not reach the live site. rules.test.mjs is run by hand (it needs the real Firebase project).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: |
          node --test $(ls tests/*.test.mjs | grep -v rules.test)
          cd worker && npm test

      # Publish only the files the app needs (not README, firestore.rules, firebase.json, ...).
      - name: Collect app files
        run: |
          mkdir _site
          cp -r fonts _site/
          cp index.html app.js progress.js share.js vault.js vault-ui.js review-order.js paging.js library-view.js bulk.js inbox.js export-import.js cleanup.js study.js shortcuts.js mirror.js delta.js sync-status.js agent.js agent-ui.js cloud.js version.js version.json firebase-config.js sw.js style.css manifest.webmanifest icon.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png og-image.png CNAME _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
